<title>Theater with her — cartelera de Lima</title>
<link rel="stylesheet" href="styles.css?v=20261106-telon">

<body>

<!-- La cabecera y el menú son lo único de DOM que NO vive en los módulos de
     vista, y a propósito: son constantes, no datos. Puestos acá se ven durante
     "Cargando cartelera…" y sobreviven a los estados de error y de cartelera
     vencida, que reemplazan todo #app. Ninguna de las otras vistas depende de
     que la cartelera pueda cargar. -->
<header class="sitio">
  <!-- Solo en el teléfono: en escritorio el menú está siempre a la vista. -->
  <button class="menu-boton" type="button" aria-controls="menu" aria-expanded="false" aria-label="Abrir el menú">
    <span class="menu-rayas" aria-hidden="true"></span>
  </button>
  <h1>Theater with her <span class="corazon" aria-hidden="true"></span></h1>
</header>

<div class="menu-velo" hidden></div>
<!-- Siete destinos ya no entran en una barra: el menú es una columna. En el
     teléfono es un panel que se abre desde la izquierda; en escritorio está
     fijo y se pliega a una franja de íconos. Lo gobierna app.js. -->
<nav id="menu" class="menu" aria-label="Secciones principales">
  <ul class="menu-lista">
    <li><a class="menu-item" href="#cartelera" data-ruta="cartelera"><svg class="menu-icono" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8.5 3v4M15.5 3v4"/></svg><span class="menu-nombre">Cartelera</span></a></li>

  </button>
</nav>

<main id="app" class="app">
  <p class="cargando">Cargando cartelera…</p>
</main>

<!-- app.js decide la ruta. Cada vista conserva su propio DOM: la cartelera
     tiene mapa y datos dinámicos; las demás son autosuficientes. -->
<script type="module">
import { arrancarApp } from './js/app.js';
arrancarApp(document.getElementById('app'));
</script>
